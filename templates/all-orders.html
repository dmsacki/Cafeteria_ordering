<!DOCTYPE html>
<html>
<head>
    <title>All Orders - Admin View</title>
</head>
<body>
    <h1>All Orders</h1>
    {% if orders %}
        <table border="1" cellpadding="10" cellspacing="0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Pickup Method</th>
                    <th>Payment Method</th>
                    <th>Items</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.name }}</td>
                    <td>{{ order.phone }}</td>
                    <td>{{ order.pickup_method }}</td>
                    <td>{{ order.payment_method }}</td>
                    <td>{{ order.items }}</td>
                    <td>{{ order.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No orders yet.</p>
    {% endif %}
</body>
</html>
