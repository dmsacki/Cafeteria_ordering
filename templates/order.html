<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Now</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/order.css') }}" />
  <style>
    /* Simple styles for buttons */
    .cta-button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px 5px 15px 0;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    .cta-button:hover {
      background-color: #218838;
    }
    /* Continue shopping button with blue background */
    .continue-button {
      background-color: #007bff;
    }
    .continue-button:hover {
      background-color: #0056b3;
    }
    /* Cart summary container */
    .order-summary {
      max-width: 500px;
      margin: auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <header>
    <h1>Your Order</h1>
  </header>

  <div class="order-summary">
    <h2>Order Summary</h2>

    <!-- Cart icon with badge -->
    <div style="position: relative; margin-bottom: 10px; width: 40px; margin-left: auto;">
      <!-- No image provided, so using emoji as placeholder -->
      <div style="font-size: 30px; text-align: center;">🛒</div>
      <span
        id="cart-count"
        style="
          position: absolute;
          top: 0;
          right: 0;
          background: red;
          color: white;
          font-size: 12px;
          padding: 2px 6px;
          border-radius: 50%;
          font-weight: bold;
        "
        >0</span
      >
    </div>

    <ul id="order-list">
      <!-- Items added to cart will display here -->
    </ul>
    <p>
      Total: TZS <span id="order-total">0.00</span>
    </p>

    <button class="cta-button" onclick="clearCart()">Clear Cart</button>
    <button
      class="cta-button continue-button"
      onclick="window.location.href='/menu'"
      title="Continue Shopping"
    >
      ← Continue Shopping
    </button>

    <br /><br />
  </div>

  <!-- Order Form -->
  <div class="order-form" style="max-width: 500px; margin: 40px auto;">
    <h2>Place Your Order</h2>
    <form action="/place_order" method="POST" onsubmit="return validateAndConfirm()">
      <label for="name">Full Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        pattern="^[A-Za-z\s]{3,}$"
        title="Please enter your full name (at least 3 characters)."
      />

      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        required
        pattern="^\d{10}$"
        title="Please enter a valid phone number (exactly 10 digits)."
      />

      <label for="pickup-method">Pickup Method:</label>
      <select id="pickup-method" name="pickup_method" required>
        <option value="pickup">Pickup</option>
        <option value="delivery">Delivery</option>
      </select>

      <label for="payment-method">Payment Method:</label>
      <select id="payment-method" name="payment_method" required>
        <option value="m-pesa">M-Pesa</option>
        <option value="airtel-money">Airtel Money</option>
        <option value="tigo-pesa">Tigo Pesa</option>
        <option value="halo-pesa">Halo Pesa</option>
        <option value="credit-card">Credit Card</option>
      </select>

      <button type="submit" class="cta-button" style="margin-top: 30px;">
        Place Order
      </button>
      <button
        type="button"
        class="cta-button continue-button"
        onclick="window.location.href='/menu'"
        style="margin-top: 30px;"
      >
        ← Continue Shopping
      </button>
    </form>
  </div>

  <!-- JavaScript for Cart & Summary -->
  <script src="{{ url_for('static', filename='js/cart.js') }}"></script>

  <script>
    // Validation and confirmation on form submit
    function validateAndConfirm() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (name === "") {
        alert("Please enter your full name.");
        return false;
      }

      if (phone.length !== 10 || !/^\d{10}$/.test(phone)) {
        alert("Phone number must be exactly 10 digits.");
        return false;
      }

      return confirm("Are you sure you want to place this order?");
    }

    // Example placeholder for goToOrderPage function if needed
    function goToOrderPage() {
      // You can redirect to an order page or show summary etc.
      // For example, just alert or redirect
      alert("Proceeding to order page...");
      // window.location.href = "/order"; // or any other page
    }
  </script>
</body>
</html>
